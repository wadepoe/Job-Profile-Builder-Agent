kind: Asset
type: mcp-server

metadata:
  name: sap-sf-rcm-job-requisition-mcp-server
  description: Exposes SAP SuccessFactors Job Requisition API as MCP tools for reading requisitions and linking completed job profiles
  version: "1.0.0"
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.edmx

provides:
  apis:
    - name: sap-sf-rcm-job-requisition-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:job-profile-builder-a798b.sap-sf-rcm-job-requisition-mcp-server:v1

requires:
  - name: RCMJobRequisition
    kind: api
    ordId: sap.sf:apiResource:RCMJobRequisition:v1
